<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="linkedin-comment-skill — comment early, comment well">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A66C2"/>
      <stop offset="1" stop-color="#004182"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8F0FE"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <circle cx="1050" cy="60" r="90" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="110" cy="300" r="70" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="980" cy="300" r="40" fill="#FFFFFF" opacity="0.10"/>
  <text x="60" y="90" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="bold" fill="#FFFFFF">linkedin-comment-skill</text>
  <text x="60" y="135" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#D6E8FA">Comment early. Comment well. Grow on LinkedIn.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="60" y="170" width="170" height="54" rx="27" fill="#FFFFFF"/>
    <text x="145" y="205" font-size="22" font-weight="bold" fill="#0A66C2" text-anchor="middle">24h — daily</text>
    <rect x="250" y="170" width="170" height="54" rx="27" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="335" y="205" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3 days</text>
    <rect x="440" y="170" width="170" height="54" rx="27" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="525" y="205" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">7 days</text>
  </g>
  <g>
    <rect x="700" y="150" width="440" height="130" rx="16" fill="url(#bubble)"/>
    <text x="730" y="190" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0A66C2">“The 2-hour window is the part</text>
    <text x="730" y="218" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0A66C2">most people miss…”</text>
    <text x="730" y="252" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#444444">Specific reference + insight + question.</text>
    <text x="730" y="272" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#444444">Never “Great post! 🔥”</text>
  </g>
  <text x="60" y="320" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#BFD9F2">Draft-only by default  •  Opt-in auto mode with your own rate limits  •  You choose</text>
</svg>
